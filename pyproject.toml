[project]
name = "metadrive-ais"
version = "0.1.0"
description = "AlpaSim / Alpamayo workspace for 4x Quadro RTX 8000 (Turing); gsplat sensorsim renderer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# gsplat renderer service; see scripts/setup_render_env.sh for the torch/gsplat pins.
render = ["gsplat==1.5.3", "grpcio", "protobuf>=4,<5", "scipy", "pillow"]
dev = ["pytest>=8", "ruff>=0.6"]

# AlpaSim driver plugin: VaVAM-B conditioned on an AIS memory.
[project.entry-points."alpasim.models"]
vavam_ais = "metadrive_ais.drivers.vavam_ais:VaVAMAISModel"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
