# MetaDrive-RL driver: high-level policy + mode-conditioned planner.
# Select the policy with `driver.model.checkpoint_path=<spec>` where <spec> is
# `rule`, `fixed:<ACTION>` (e.g. fixed:YIELD), or a policy YAML path.

log_level: ${wizard.log_level}

model:
  model_type: metadrive
  checkpoint_path: rule
  device: cuda

host: "0.0.0.0"
port: ???

inference:
  use_cameras: ["camera_front_wide_120fov"]
  max_batch_size: 8
  subsample_factor: 1
  context_length: 1
  output_frequency_hz: 10

route:
  use_waypoint_commands: true

output_dir: "/mnt/output/driver"

trajectory_optimizer:
  enabled: false

plot_debug_images: false
