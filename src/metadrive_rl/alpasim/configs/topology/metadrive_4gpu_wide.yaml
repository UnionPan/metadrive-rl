# @package _global_
# 4x RTX 8000, higher concurrency than metadrive_4gpu: three external gsplat
# renderers (GPUs 0, 1, 3), CATK replicas on GPUs 0 and 3, 16 rollouts in
# flight across 2 runtime worker processes. The pipeline is latency-bound
# (serial gRPC steps per rollout), so more rollouts in flight use idle GPUs.
#   GPU 0: physics + CATK 1 + renderer 3   GPU 1: renderer 1
#   GPU 2: MetaDrive driver (external)      GPU 3: renderer 2 + CATK 2

defines:
  nre_cache_size: 5  # read by runtime config interpolation; our renderers use CACHE_SIZE

trafficsim:
  server:
    max_workers: 8

services:
  renderer:
    replicas_per_container: 1
    gpus: [1]
  driver:
    replicas_per_container: 1
    gpus: [2]
  physics:
    replicas_per_container: 2
    gpus: [0]
  trafficsim:
    replicas_per_container: 1
    gpus: [0, 3]
  controller:
    replicas_per_container: 4
    gpus: null

runtime:
  nr_workers: 2
  endpoints:
    renderer:
      n_concurrent_rollouts: 6   # per external renderer address (x3)
    driver:
      n_concurrent_rollouts: 16
    physics:
      n_concurrent_rollouts: 8   # x 2 replicas
      skip: false
    controller:
      n_concurrent_rollouts: 4   # x 4 replicas
    trafficsim:
      n_concurrent_rollouts: 8   # x 2 GPUs
