# @package _global_
# One self-contained MetaDrive stack on a single GPU (METADRIVE_STACK_GPU,
# default 1): physics, CATK, and (outside the wizard) driver and renderer.
# Lets an extra concurrent stack use an idle GPU instead of adding load to
# the GPU that hosts physics/CATK for the other stacks.

defines:
  nre_cache_size: 5

trafficsim:
  server:
    max_workers: 4

services:
  renderer:
    replicas_per_container: 1
    gpus: ["${oc.decode:${oc.env:METADRIVE_STACK_GPU,1}}"]
  driver:
    replicas_per_container: 1
    gpus: ["${oc.decode:${oc.env:METADRIVE_STACK_GPU,1}}"]
  physics:
    replicas_per_container: 1
    gpus: ["${oc.decode:${oc.env:METADRIVE_STACK_GPU,1}}"]
  trafficsim:
    replicas_per_container: 1
    gpus: ["${oc.decode:${oc.env:METADRIVE_STACK_GPU,1}}"]
  controller:
    replicas_per_container: 2
    gpus: null

runtime:
  nr_workers: 1
  endpoints:
    renderer:
      n_concurrent_rollouts: 4
    driver:
      n_concurrent_rollouts: 8
    physics:
      n_concurrent_rollouts: 8
      skip: false
    controller:
      n_concurrent_rollouts: 4
    trafficsim:
      n_concurrent_rollouts: 4
