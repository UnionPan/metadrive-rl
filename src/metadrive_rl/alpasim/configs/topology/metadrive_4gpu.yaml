# @package _global_
# 4x RTX 8000 topology for MetaDrive runs with external driver and renderers.
#   GPU 0: physics + CATK replica 1    GPU 1: gsplat renderer 1 (external)
#   GPU 2: MetaDrive driver (external) GPU 3: gsplat renderer 2 (external) + CATK replica 2
# Capacity per service = nr_gpus x replicas_per_container x n_concurrent_rollouts.

defines:
  nre_cache_size: 5  # read by runtime config interpolation; our renderers use CACHE_SIZE

trafficsim:
  server:
    max_workers: 4

services:
  # Renderer and driver run outside the wizard (external_services); entries
  # are still required by the topology schema.
  renderer:
    replicas_per_container: 1
    gpus: [1]
  driver:
    replicas_per_container: 1
    gpus: [2]
  physics:
    replicas_per_container: 1
    gpus: [0]
  trafficsim:
    replicas_per_container: 1
    gpus: [0, 3]
  controller:
    replicas_per_container: 2
    gpus: null

runtime:
  nr_workers: 1
  endpoints:
    renderer:
      n_concurrent_rollouts: 4   # per external renderer address
    driver:
      n_concurrent_rollouts: 8
    physics:
      n_concurrent_rollouts: 8
      skip: false
    controller:
      n_concurrent_rollouts: 4   # x 2 replicas
    trafficsim:
      n_concurrent_rollouts: 4   # x 2 GPUs
