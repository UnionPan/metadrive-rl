# @package _global_
# MetaDrive driver on this host plus an externally launched renderer, by
# default the gsplat renderer (scripts/serve_gsplat_renderer.sh), which runs
# on Turing GPUs where NVIDIA's NRE has no kernels. Address from the environment:
#   METADRIVE_RENDERER_ADDR=localhost:46100
# Requires host networking: wizard.debug_flags.use_localhost=True.

wizard:
  run_sim_services: ["physics", "trafficsim", "controller", "runtime"]
  external_services:
    driver: ["localhost:6789"]
    renderer: ["${oc.env:METADRIVE_RENDERER_ADDR}"]

runtime:
  endpoints:
    driver:
      skip: false
  # Render only the camera the MetaDrive driver consumes.
  simulation_config:
    cameras:
      - height: 320
        width: 512
        logical_id: camera_front_wide_120fov
        frame_interval_us: 100_000
        shutter_duration_us: 30_000
