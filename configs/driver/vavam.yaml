# VaVAM-B (valeoai/VideoActionModel v1.0.0, VAM_width_1024) as an AlpaSim driver
# on this host (python -m alpasim_driver.main --config-path configs/driver
# --config-name vavam). Mirrors AlpaSim's wizard driver/vavam.yaml with local
# assets (data/download_vavam_assets.sh --model VaVAM-B). The model runs in fp16.
# context_length: 1 is the AlpaSim preset (B0a); VaVAM-B was trained with 8
# frames at 2 Hz (B0b: inference.context_length=8).
log_level: INFO
model:
  model_type: vam
  checkpoint_path: ${oc.env:HOME}/ext/alpasim/data/drivers/vavam/VAM_width_1024_pretrained_139k.pt
  tokenizer_path: ${oc.env:HOME}/ext/alpasim/data/drivers/vavam/VQ_ds16_16384_llamagen_encoder.jit
  device: cuda
host: "0.0.0.0"
port: 6789
inference:
  use_cameras: ["camera_front_wide_120fov"]
  max_batch_size: 32
  subsample_factor: 1
  context_length: 1
route:
  default_command: 2
  use_waypoint_commands: true
  command_distance_threshold: 3.0
  min_lookahead_distance: 20.0
output_dir: ./runs/driver
trajectory_optimizer:
  enabled: false
plot_debug_images: false
