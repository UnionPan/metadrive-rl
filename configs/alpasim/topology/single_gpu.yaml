# @package _global_
# One self-contained stack on a single GPU (ALPASIM_STACK_GPU, default 0):
# physics and CATK in the wizard's containers; driver and renderer run outside
# the wizard on the same GPU (scripts/run_alpasim.sh).

defines:
  nre_cache_size: 5

trafficsim:
  server:
    max_workers: 4

services:
  renderer:
    replicas_per_container: 1
    gpus: ["${oc.decode:${oc.env:ALPASIM_STACK_GPU,0}}"]
  driver:
    replicas_per_container: 1
    gpus: ["${oc.decode:${oc.env:ALPASIM_STACK_GPU,0}}"]
  physics:
    replicas_per_container: 1
    gpus: ["${oc.decode:${oc.env:ALPASIM_STACK_GPU,0}}"]
  trafficsim:
    replicas_per_container: 1
    gpus: ["${oc.decode:${oc.env:ALPASIM_STACK_GPU,0}}"]
  controller:
    replicas_per_container: 2
    gpus: null

runtime:
  nr_workers: 1
  endpoints:
    renderer:
      n_concurrent_rollouts: 2
    driver:
      n_concurrent_rollouts: 1
    physics:
      n_concurrent_rollouts: 2
      skip: false
    controller:
      n_concurrent_rollouts: 2
    trafficsim:
      n_concurrent_rollouts: 2
