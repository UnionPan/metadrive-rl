# Standalone config for running the MetaDrive driver as an external AlpaSim
# driver on the host (see scripts/run_episode.sh). Select the policy with
# `model.checkpoint_path=<spec>`: `rule`, `fixed:<ACTION>`, or a policy YAML.
log_level: INFO
model:
  model_type: metadrive
  checkpoint_path: rule
  device: cuda
host: "0.0.0.0"
port: 6789
inference:
  use_cameras: ["camera_front_wide_120fov"]
  max_batch_size: 8
  subsample_factor: 1
  context_length: 1
  output_frequency_hz: 10
route:
  use_waypoint_commands: true
output_dir: "./runs/driver"
trajectory_optimizer:
  enabled: false
plot_debug_images: false
